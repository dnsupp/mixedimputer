[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-imputer"
version = "0.2.0"
description = "Mixed-type MICE-style iterative imputer for scikit-learn — handles both numerical and categorical (string) columns in DataFrames."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "dnsupp"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.8",
    "scikit-learn>=1.6,<1.9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
io = [
    "liac-arff",
    "openpyxl",
    "xlrd",
]
dev = [
    "pytest",
    "pytest-cov",
    "liac-arff",
    "openpyxl",
    "xlrd",
    "build",
    "twine",
    "ruff",
    "jupyter",
    "plotly",
    "nbclient",
    "nbconvert",
]

[project.urls]
Repository = "https://github.com/dnsupp/mixedimputer"
Issues = "https://github.com/dnsupp/mixedimputer"
Changelog = "https://github.com/dnsupp/mixedimputer/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]